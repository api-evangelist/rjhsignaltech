aid: rjhsignaltech
name: Who Represents This Address (RJH Signal Technologies)
description: Who Represents This Address (RJH Signal Technologies) provides an AI‑operated API that returns U.S. congressional and state legislative
  districts, current officeholders, statewide executives, mayoral information, and local boundaries for a given street address. It serves as a
  drop‑in replacement for the discontinued Google Civic Information API, offering free tier access and paid per‑call options, with batch lookup
  support for up to 40 addresses.
